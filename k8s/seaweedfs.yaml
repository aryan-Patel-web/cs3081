apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
      - name: seaweedfs
        image: chrislusf/seaweedfs:3.78
        args: ["server", "-dir=/data", "-master.port=9333", "-volume.port=8080", "-filer=true", "-s3"]
        ports:
        - containerPort: 9333
        - containerPort: 8080
        - containerPort: 8888
        - containerPort: 8333
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-filer
  namespace: data
spec:
  selector:
    app: seaweedfs
  ports:
  - name: master
    port: 9333
    targetPort: 9333
  - name: volume
    port: 8080
    targetPort: 8080
  - name: filer
    port: 8888
    targetPort: 8888
  - name: s3
    port: 8333
    targetPort: 8333
