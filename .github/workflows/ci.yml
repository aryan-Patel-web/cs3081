name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: pip install ruff && ruff check . || true
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.12'}
    - run: pip install pytest && python -m pytest tests -q
  evaluate:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - uses: actions/checkout@v4
    - run: python3 tools/score.py results/pred_student_v1.jsonl data/validation.jsonl --out results/score_student_v1.json || true
  gate:
    runs-on: ubuntu-latest
    needs: evaluate
    steps:
    - uses: actions/checkout@v4
    - run: python3 tools/score.py results/pred_student_v1.jsonl data/validation.jsonl --min-validity 95
  secret-scan:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: gitleaks/gitleaks-action@v2
